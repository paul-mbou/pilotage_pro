name: pilotage_pro
description: Pilotage Pro - Business Management & POS Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^13.0.1
  intl: ^0.19.0
  fl_chart: ^0.66.0
  uuid: ^4.3.3
  google_fonts: ^6.1.0
  iconsax: ^0.0.8
  shimmer: ^3.0.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.2
  hugeicons: ^1.1.6
  cached_network_image: ^3.4.1
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^6.1.1
  local_auth: ^2.3.0
  firebase_core: ^3.15.2
  firebase_auth: ^5.6.3
  cloud_firestore: ^5.6.12
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
